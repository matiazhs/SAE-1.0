{% load static %}

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Cargo</title>
    <link
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link href="{% static 'css/estilos_editar.css' %}" rel="stylesheet" />
  </head>

  <body>
    {% include "barradenavegacion.html" %}
    <div class="container mt-5">
      <div class="auth-section">
        <h2 class="text-center">DETALLE DEL CARGO</h2>

        <div class="form-group mb-3">
          <label class="form-label">Cargo</label>
          <input
            type="text"
            class="form-control"
            value="{{ cargo.cargo }}"
            readonly
          />
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Especialidad</label>
          <input
            type="text"
            class="form-control"
            value="{% if cargo.especialidades %}{{ cargo.especialidades }}{% else %}Sin especialidad{% endif %}"
            readonly
          />
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Cursos</label>
          {% if cargo.curso.all %}
          <ul class="list-group">
            {% for curso in cargo.curso.all %}
            <li class="list-group-item">{{ curso }}</li>
            {% endfor %}
          </ul>
          {% else %}
          <input
            type="text"
            class="form-control"
            value="Sin cursos asignados"
            readonly
          />
          {% endif %}
        </div>

        <div class="text-center mt-4">
          <a href="{% url 'asgcargos_listado' %}" class="btn btn-logout"
            >VOLVER</a
          >
        </div>
      </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
