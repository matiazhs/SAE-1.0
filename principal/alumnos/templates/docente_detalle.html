{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/estilos_editar.css' %}" rel="stylesheet">
</head>

<body>
    {% include "barradenavegacion.html" %}
    <div class="container mt-5">
        <div class="auth-section">
            <h2 class="text-center">DETALLE DEL DOCENTE</h2>

            <div class="form-group mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" value="{{ docente.nombre }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" value="{{ docente.apellido }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">CUIL</label>
                <input type="text" class="form-control" value="{{ docente.cuil }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" value="{{ docente.fecha_nacimiento }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Nº Legajo</label>
                <input type="text" class="form-control" value="{{ docente.numero_legajo }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" value="{{ docente.email }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" value="{{ docente.telefono }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Domicilio</label>
                <input type="text" class="form-control" value="{{ docente.domicilio }}" readonly>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Teléfono de Emergencia</label>
                <input type="text" class="form-control" value="{{ docente.telefono_emergencia }}" readonly>
            </div>

            <div class="form-group mb-4">
                <label class="form-label">Fecha de Ingreso</label>
                <input type="date" class="form-control" value="{{ docente.fecha_ingreso }}" readonly>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'docentes_listado' %}" class="btn btn-logout">VOLVER</a>
            </div>


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
