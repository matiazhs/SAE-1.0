{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Cargos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/estilos_listados.css' %}">
</head>

<body>
    {% include "barradenavegacion.html" %}
    <br><br><br>

    <div class="container">
        <h1 class="mb-4">Gestión de Cargos</h1>

        <div class="mt-4">
            <a href="{% url 'crear_cargo' %}" class="btn btn-dark btn-crear-especialidad">CREAR
                CARGO</a>
        </div>

        <br>

        <div>
            <table id="tabla-tipos-cargo" class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tipo in tipo_cargo %}
                    <tr>
                        <td>{{ tipo.nombre }}</td>
                        <td>{{ tipo.descripcion }}</td>
                        <td>
                            <a href="{% url 'tipocargo_editar' pk=tipo.pk %}" class="btn btn-sm boton-editar" title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{% url 'tipocargo_eliminar' pk=tipo.pk %}" class="btn btn-sm boton-eliminar" title="Eliminar">
                                <i class="fas fa-trash-alt"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script src="{% static 'js/script_tipocargo.js' %}"></script>

</body>

</html>
