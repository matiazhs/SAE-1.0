{% load static %} {% load widget_tweaks %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ titulo }}</title>

    <!-- Bootstrap, DataTables y FontAwesome -->
    <link
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% static 'bootstrap/css/dataTables.bootstrap5.min.css' %}"
    />
    <link rel="stylesheet" href="{% static 'bootstrap/css/all.min.css' %}" />

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/estilos_listados.css' %}" />
  </head>

  <body>
    {% include "barradenavegacion.html" %}
    <br /><br /><br />

    <div class="container">
      <h1 class="mb-4">{{ titulo }}</h1>

      <!-- Botón para crear nueva especialidad -->
      <div class="mt-4">
        <a
          href="{% url 'crear_especialidades' %}"
          class="btn btn-dark btn-crear-especialidad"
          >CREAR ESPECIALIDAD</a
        >
      </div>
      <br />
      <div class="row mb-3">
        <!-- Buscador personalizado -->
        <div class="col-12 mb-3">
          <label for="buscadorPersonalizado" class="form-label"
            >Buscar en todos los campos:</label
          >
          <div class="input-group">
            <input
              type="text"
              id="buscadorPersonalizado"
              class="form-control"
              placeholder="Escribe para buscar..."
            />
            <button class="btn btn-dark" type="button" id="btnLimpiarBusqueda">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Tabla de especialidades -->
      <div class="table-responsive">
        <table
          id="tablaEspecialidades"
          class="table table-striped table-bordered align-middle text-center"
        >
          <thead class="table-dark">
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {% for c in object_list %}
            <tr>
              <td>{{ c.nombre }}</td>
              <td>{{ c.descripcion }}</td>
              <td>
                <a
                  href="{% url 'especialidad_editar' pk=c.pk %}"
                  class="btn btn-sm boton-editar"
                  title="Editar"
                >
                  <i class="fas fa-edit"></i>
                </a>
                <a
                  href="{% url 'eliminar_especialidad' nombre=c.nombre %}"
                  class="btn btn-sm boton-eliminar"
                  title="Eliminar"
                >
                  <i class="fas fa-trash-alt"></i>
                </a>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="3" class="text-muted">
                No hay especialidades registradas.
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'bootstrap/js/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'bootstrap/js/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'bootstrap/js/dataTables.bootstrap5.min.js' %}"></script>

    <script src="{% static 'js/scripts_gestion_especialidades.js' %}"></script>
  </body>
</html>
