{% load static %}

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión</title>

    <link
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />

    <link
      href="{% static 'css/estilos_gral_formularios.css' %}"
      rel="stylesheet"
    />
  </head>

  <body>
    {% include "barradenavegacion.html" %}

    <br /><br />
    <h2>Editar perfil</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Formulario con los campos para editar los datos -->
      <div class="form-group">
        <label for="id_first_name">Nombre:</label>
        {{ form.first_name }}
      </div>

      <div class="form-group">
        <label for="id_last_name">Apellido:</label>
        {{ form.last_name }}
      </div>

      <div class="form-group">
        <label for="id_email">Correo electrónico:</label>
        {{ form.email }}
      </div>

      <!-- Campo para cargar el avatar -->
      <div class="form-group">
        <label for="id_avatar">Foto de perfil:</label>
        {{ form.avatar }}
      </div>

      <div class="avatar-preview">
        {% if user.avatar %}
        <img
          id="avatarPreview"
          src="{{ user.avatar.url }}"
          alt="Avatar"
          class="avatar"
        />
        {% else %}
        <img
          id="avatarPreview"
          src="/static/default-avatar.png"
          alt="Avatar"
          class="avatar"
        />
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
      integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
      crossorigin="anonymous"
    ></script>

    <script src="{% static 'js/script_edit_profil.js' %}"></script>
  </body>
</html>
